<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>SHREESHAKTI | Civil Engineering Consultancy</title>
    
    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&amp;family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    
    <!-- Tailwind Configuration -->
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                "tertiary-fixed-dim": "#c6c6c7", "inverse-surface": "#303031", "tertiary": "#000000",
                "on-secondary-fixed-variant": "#544600", "surface-dim": "#dbdad9", "secondary-container": "#fdd400",
                "surface-variant": "#e4e2e2", "on-surface-variant": "#4c4546", "on-tertiary": "#ffffff",
                "on-secondary-fixed": "#221b00", "secondary-fixed-dim": "#e9c400", "surface-container-high": "#e9e8e7",
                "on-secondary-container": "#6f5c00", "surface-container-low": "#f5f3f3", "background": "#fbf9f8",
                "surface-tint": "#5e5e5e", "on-primary-fixed-variant": "#474747", "on-error": "#ffffff",
                "surface-container-lowest": "#ffffff", "secondary-fixed": "#ffe170", "surface-container": "#efeded",
                "tertiary-container": "#1a1c1c", "error": "#ba1a1a", "surface-bright": "#fbf9f8",
                "on-primary-fixed": "#1b1b1b", "primary-container": "#1b1b1b", "on-background": "#1b1c1c",
                "primary": "#000000", "on-error-container": "#93000a", "inverse-primary": "#c6c6c6",
                "surface-container-highest": "#e4e2e2", "on-surface": "#1b1c1c", "primary-fixed": "#e2e2e2",
                "on-tertiary-fixed": "#1a1c1c", "on-primary-container": "#848484", "tertiary-fixed": "#e2e2e2",
                "on-primary": "#ffffff", "outline": "#7e7576", "inverse-on-surface": "#f2f0f0",
                "secondary": "#705d00", "outline-variant": "#cfc4c5", "on-tertiary-container": "#838484",
                "on-tertiary-fixed-variant": "#454747", "surface": "#fbf9f8", "error-container": "#ffdad6",
                "primary-fixed-dim": "#c6c6c6", "on-secondary": "#ffffff"
            },
            "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
            "spacing": { "container-max": "1280px", "margin-desktop": "64px", "margin-mobile": "20px", "gutter": "24px", "unit": "8px" },
            "fontFamily": {
                "display-lg-mobile": ["Montserrat"], "body-lg": ["Inter"], "headline-xl": ["Montserrat"],
                "headline-lg": ["Montserrat"], "label-md": ["Inter"], "display-lg": ["Montserrat"],
                "body-md": ["Inter"], "headline-md": ["Montserrat"], "label-bold": ["Inter"]
            },
            "fontSize": {
                "display-lg-mobile": ["40px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "800" }],
                "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                "headline-xl": ["48px", { "lineHeight": "1.2", "fontWeight": "700" }],
                "headline-lg": ["32px", { "lineHeight": "1.3", "fontWeight": "700" }],
                "label-md": ["14px", { "lineHeight": "1", "fontWeight": "500" }],
                "display-lg": ["64px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                "headline-md": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }],
                "label-bold": ["14px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "700" }]
            }
          }
        }
      }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; display: inline-block; vertical-align: middle; }
        .structural-layer { box-shadow: 4px 4px 0px 0px #000000; }
        .yellow-accent-border { border-bottom: 4px solid #fdd400; }
        .diagonal-hatch { background-image: repeating-linear-gradient(45deg, #e4e2e2, #e4e2e2 10px, transparent 10px, transparent 20px); }
    </style>
</head>
<body class="bg-background text-on-background font-body-md overflow-x-hidden">
    
    {% include "header.html" %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include "footer.html" %}

    <script>
        // Micro-interaction for scroll effects
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 50) {
                header.classList.add('shadow-lg');
                header.classList.add('bg-background/95');
            } else {
                header.classList.remove('shadow-lg');
                header.classList.remove('bg-background/95');
            }
        });

        // Hover effect for service cards/icons
        document.querySelectorAll('.group').forEach(card => {
            card.addEventListener('mouseenter', () => {
                const icon = card.querySelector('.material-symbols-outlined');
                if(icon) icon.style.fontVariationSettings = "'FILL' 1";
            });
            card.addEventListener('mouseleave', () => {
                const icon = card.querySelector('.material-symbols-outlined');
                if(icon) icon.style.fontVariationSettings = "'FILL' 0";
            });
        });
    </script>
</body>
</html>
